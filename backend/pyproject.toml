[project]
name = "signalwatch-api"
version = "0.1.0"
description = "RF anomaly monitoring API and analytics pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "joblib>=1.5,<2",
    "numpy>=2.2,<3",
    "pandas>=2.3,<4",
    "pyarrow>=20,<24",
    "scikit-learn>=1.7,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

