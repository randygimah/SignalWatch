services:
  pipeline:
    build:
      context: ./backend
    command: ["uv", "run", "python", "-m", "app.pipeline"]
    environment:
      SIGNALWATCH_DATA_DIR: /data
    volumes:
      - ./backend:/app
      - ./data:/data
      - backend_venv:/app/.venv

  api:
    build:
      context: ./backend
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      SIGNALWATCH_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - backend_venv:/app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  backend_venv:
  frontend_node_modules:
